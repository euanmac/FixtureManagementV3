# Builds the desktop app (FixtureManagement.Desktop, MAUI Blazor Hybrid) for Windows.
# - Runs only when started by hand: Actions tab -> this workflow -> "Run workflow". It deploys nothing to the websites.
# - Download from the run page (Artifacts):
#   FixtureManager-windows-installer = FixtureManagerSetup.exe – the one to hand out (per-user install, no admin);
#   FixtureManager-windows-x64 = the plain folder – unzip, run FixtureManagement.Desktop.exe.
# - Tick "Publish as a GitHub Release" to also release it (tag desktop-v<ApplicationDisplayVersion>). The permanent link
#   https://github.com/euanmac/FixtureManagementV3/releases/latest/download/FixtureManagerSetup.exe then serves it.
#   Bump ApplicationDisplayVersion in the Desktop csproj for each release; re-releasing the same version replaces its installer.
# - Self-contained: .NET and the Windows App SDK are bundled, so nothing needs installing first.
# - Unsigned for now: Windows SmartScreen shows "Windows protected your PC" -> More info -> Run anyway.

name: Build desktop app - Windows

on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish as a GitHub Release (updates the permanent download link)
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only used by the release step

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Only the Windows part of MAUI (the full "maui" workload also pulls in Android/iOS).
      - name: Install the MAUI workload
        run: dotnet workload install maui-windows

      - name: Run tests
        run: dotnet test FixtureManagement.Tests/FixtureManagement.Tests.csproj --configuration Release

      - name: Publish the desktop app
        run: >
          dotnet publish FixtureManagement.Desktop/FixtureManagement.Desktop.csproj
          -f net10.0-windows10.0.19041.0 -c Release -r win-x64
          --self-contained true -p:WindowsAppSDKSelfContained=true -p:WindowsPackageType=None
          -o publish/win-x64

      - name: Check the app is there
        shell: pwsh
        run: |
          if (-not (Test-Path publish/win-x64/FixtureManagement.Desktop.exe)) { Write-Error "FixtureManagement.Desktop.exe wasn't published"; exit 1 }
          Get-ChildItem publish/win-x64 | Measure-Object -Property Length -Sum | ForEach-Object { "Published {0:N0} MB" -f ($_.Sum / 1MB) }

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: FixtureManager-windows-x64
          path: publish/win-x64
          retention-days: 30

      # The installer: one FixtureManagerSetup-<version>.exe (script: FixtureManagement.Desktop/Installer/FixtureManager.iss).
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Select-Xml -Path FixtureManagement.Desktop/FixtureManagement.Desktop.csproj -XPath "//ApplicationDisplayVersion").Node.InnerText
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe (Inno Setup) not found"; exit 1 }
          & $iscc.FullName "/DAppVersion=$version" "/DSourceDir=$env:GITHUB_WORKSPACE\publish\win-x64" "/O$env:GITHUB_WORKSPACE\publish\installer" FixtureManagement.Desktop/Installer/FixtureManager.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem publish/installer

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: FixtureManager-windows-installer
          path: publish/installer/*.exe
          retention-days: 30

      - name: Publish a GitHub Release
        if: ${{ inputs.release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-Xml -Path FixtureManagement.Desktop/FixtureManagement.Desktop.csproj -XPath "//ApplicationDisplayVersion").Node.InnerText
          $tag = "desktop-v$version"
          $installer = "publish/installer/FixtureManagerSetup.exe"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "Release $tag exists - replacing its installer"
            gh release upload $tag $installer --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $installer --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --latest `
              --title "Fixture Manager $version (Windows)" `
              --notes "Download FixtureManagerSetup.exe and run it. It installs for the current user (no admin needed). Unsigned: if Windows SmartScreen warns, click More info -> Run anyway."
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
